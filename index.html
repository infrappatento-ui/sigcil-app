<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGCIL - Control de Insumos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div id="app" class="p-6 max-w-5xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">SIGCIL</h1>
      <p class="text-sm text-gray-600 mb-6">Sistema Integral de Gestión y Control de Insumos de Limpieza</p>

      <!-- Configuración de Conexión -->
      <div id="config-panel" class="mb-6 p-4 bg-amber-50 rounded border border-amber-200">
        <h2 class="text-md font-semibold text-amber-800 mb-2">Conexión a Supabase Real</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700">Project URL:</label>
            <input type="text" id="supabase-url" class="w-full text-xs p-2 border rounded" placeholder="https://drcsvtgrtxpiek...supabase.co">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700">Anon Key:</label>
            <input type="password" id="supabase-key" class="w-full text-xs p-2 border rounded" placeholder="eyJh...">
          </div>
          <button onclick="saveConfig()" class="bg-amber-600 text-white text-xs px-4 py-2 rounded font-semibold hover:bg-amber-700">Guardar y Conectar</button>
        </div>
      </div>

      <!-- Pantalla de Login -->
      <div id="auth-panel" class="hidden">
        <h2 class="text-lg font-bold mb-4">Acceso al Sistema</h2>
        <div class="space-y-4 max-w-sm">
          <div>
            <label class="block text-xs font-bold">Correo electrónico</label>
            <input type="email" id="email" class="w-full p-2 border rounded text-sm" placeholder="usuario@empresa.com">
          </div>
          <div>
            <label class="block text-xs font-bold">Contraseña</label>
            <input type="password" id="password" class="w-full p-2 border rounded text-sm" placeholder="••••••••">
          </div>
          <button onclick="login()" class="w-full bg-slate-800 text-white py-2 rounded font-semibold hover:bg-slate-700">Ingresar</button>
        </div>
        <div id="auth-error" class="mt-3 text-red-600 text-xs hidden"></div>
      </div>

      <!-- Panel Principal -->
      <div id="main-panel" class="hidden">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
          <div>
            <p class="text-xs text-gray-500">Usuario activo:</p>
            <p id="user-email" class="font-bold text-sm"></p>
            <span id="user-role-badge" class="inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700 uppercase"></span>
          </div>
          <button onclick="logout()" class="text-xs text-red-600 underline">Cerrar Sesión</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- Columna Izquierda (2 cols): Stock y Costos -->
          <div class="md:col-span-2">
            <div class="flex justify-between items-center mb-3">
              <h2 class="text-lg font-bold">Depósito: Salta 2</h2>
              <div id="total-cost-container" class="hidden text-right">
                <span class="text-xs text-gray-500 block">Valorizado Total Stock:</span>
                <span id="total-cost-val" class="text-sm font-extrabold text-emerald-700">$0.00</span>
              </div>
            </div>
            
            <div id="stock-list" class="space-y-2">
              <p class="text-xs text-gray-500">Cargando datos en tiempo real...</p>
            </div>
          </div>

          <!-- Columna Derecha: Registrar Consumo (RN-001) -->
          <div class="bg-gray-50 p-4 rounded border h-fit">
            <h2 class="text-md font-bold text-slate-800 mb-3">Registrar Consumo</h2>
            <form id="consumption-form" onsubmit="handleConsume(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-gray-700">Producto</label>
                <select id="product-select" class="w-full p-2 border rounded text-xs bg-white" required>
                  <option value="">Seleccione insumo...</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700">Cantidad a retirar</label>
                <input type="number" id="qty-input" min="1" class="w-full p-2 border rounded text-xs" required placeholder="Ej: 5">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700">Informado por (Retira)</label>
                <input type="text" id="informed-input" class="w-full p-2 border rounded text-xs" required placeholder="Nombre del personal">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-700">Observación / Nota</label>
                <input type="text" id="note-input" class="w-full p-2 border rounded text-xs" placeholder="Opcional">
              </div>
              <button type="submit" id="btn-submit" class="w-full bg-emerald-600 text-white py-2 rounded text-xs font-bold hover:bg-emerald-700">Confirmar Registro</button>
            </form>
            <div id="form-msg" class="mt-3 text-xs p-2 rounded hidden"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let currentUser = null;
    let currentUserRole = 'VIGILADOR';

    function saveConfig() {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();
      if (!url || !key) return alert('Por favor ingresa URL y Anon Key de Supabase.');
      localStorage.setItem('sb_url', url);
      localStorage.setItem('sb_key', key);
      initSupabase();
    }

    function initSupabase() {
      const url = localStorage.getItem('sb_url');
      const key = localStorage.getItem('sb_key');
      if (url && key) {
        supabaseClient = window.supabase.createClient(url, key);
        document.getElementById('config-panel').classList.add('hidden');
        document.getElementById('auth-panel').classList.remove('hidden');
        checkSession();
      }
    }

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showMain(session.user);
      }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errDiv = document.getElementById('auth-error');
      errDiv.classList.add('hidden');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errDiv.textContent = error.message;
        errDiv.classList.remove('hidden');
      } else {
        showMain(data.user);
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      document.getElementById('main-panel').classList.add('hidden');
      document.getElementById('auth-panel').classList.remove('hidden');
    }

    async function showMain(user) {
      currentUser = user;
      document.getElementById('auth-panel').classList.add('hidden');
      document.getElementById('main-panel').classList.remove('hidden');
      document.getElementById('user-email').textContent = user.email;

      // Consultar perfil del usuario
      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', user.id).single();
      currentUserRole = profile ? profile.role : 'VIGILADOR';
      
      const badge = document.getElementById('user-role-badge');
      badge.textContent = `Rol: ${currentUserRole}`;
      badge.className = currentUserRole === 'VIGILADOR' 
        ? 'inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 uppercase'
        : 'inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800 uppercase';

      loadStockAndPrices();
    }

    async function loadStockAndPrices() {
      // 1. Cargar Stock
      const { data: stockData, error: stockErr } = await supabaseClient.from('stock').select('product_id, qty');
      const container = document.getElementById('stock-list');
      const select = document.getElementById('product-select');
      const costContainer = document.getElementById('total-cost-container');
      const totalVal = document.getElementById('total-cost-val');

      if (stockErr) {
        container.innerHTML = `<p class="text-red-600 text-xs">Error al cargar stock: ${stockErr.message}</p>`;
        return;
      }

      // 2. Intentar Cargar Precios (Protegido por RLS - RN-005)
      let pricesMap = {};
      let canSeePrices = false;

      if (currentUserRole !== 'VIGILADOR') {
        const { data: pricesData, error: pricesErr } = await supabaseClient.from('precios_insumos').select('product_id, estimated_unit_price');
        if (!pricesErr && pricesData) {
          canSeePrices = true;
          pricesData.forEach(p => { pricesMap[p.product_id] = p.estimated_unit_price; });
        }
      }

      select.innerHTML = '<option value="">Seleccione insumo...</option>';
      let grandTotalCost = 0;

      container.innerHTML = stockData.map(item => {
        const nameFormatted = item.product_id.replace(/-/g, ' ');
        select.innerHTML += `<option value="${item.product_id}">${nameFormatted} (Disponible: ${item.qty})</option>`;
        
        let priceHtml = '';
        if (canSeePrices) {
          const unitPrice = pricesMap[item.product_id] || 0;
          const totalItemCost = unitPrice * item.qty;
          grandTotalCost += totalItemCost;
          priceHtml = `
            <div class="text-right ml-4">
              <span class="text-xs text-gray-500 block">$${unitPrice.toFixed(2)} c/u</span>
              <span class="text-xs font-semibold text-slate-700">$${totalItemCost.toFixed(2)}</span>
            </div>
          `;
        }

        return `
          <div class="flex justify-between items-center p-3 bg-gray-50 rounded border text-sm">
            <span class="font-medium capitalize">${nameFormatted}</span>
            <div class="flex items-center">
              <span class="font-bold bg-slate-200 px-3 py-1 rounded text-xs">${item.qty} u</span>
              ${priceHtml}
            </div>
          </div>
        `;
      }).join('');

      if (canSeePrices) {
        costContainer.classList.remove('hidden');
        totalVal.textContent = `$${grandTotalCost.toLocaleString('es-AR', { minimumFractionDigits: 2 })}`;
      } else {
        costContainer.classList.add('hidden');
      }
    }

    async function handleConsume(e) {
      e.preventDefault();
      const msgDiv = document.getElementById('form-msg');
      const btn = document.getElementById('btn-submit');
      msgDiv.classList.add('hidden');
      btn.disabled = true;

      const productId = document.getElementById('product-select').value;
      const qty = parseInt(document.getElementById('qty-input').value);
      const informedBy = document.getElementById('informed-input').value;
      const note = document.getElementById('note-input').value;

      const { data, error } = await supabaseClient.rpc('registrar_consumo', {
        p_building_id: 'salta-2',
        p_product_id: productId,
        p_qty: qty,
        p_informed_by: informedBy,
        p_registered_by: currentUser.email,
        p_note: note
      });

      if (error) {
        msgDiv.className = 'mt-3 text-xs p-2 rounded bg-red-100 text-red-700 border border-red-200';
        msgDiv.textContent = `Error: ${error.message}`;
        msgDiv.classList.remove('hidden');
      } else {
        msgDiv.className = 'mt-3 text-xs p-2 rounded bg-emerald-100 text-emerald-700 border border-emerald-200';
        msgDiv.textContent = 'Consumo registrado exitosamente.';
        msgDiv.classList.remove('hidden');
        document.getElementById('consumption-form').reset();
        loadStockAndPrices();
      }
      btn.disabled = false;
    }

    const savedUrl = localStorage.getItem('sb_url');
    if (savedUrl) {
      document.getElementById('supabase-url').value = savedUrl;
      document.getElementById('supabase-key').value = localStorage.getItem('sb_key');
      initSupabase();
    }
  </script>
</body>
</html>
